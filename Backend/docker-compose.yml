name: medical-consultation-system

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_aligned_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6386:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  backend:
    build: .
    environment:
      ENV: production
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: app
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: ${SECRET_KEY:-development-only-change-me}
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-dummy-api-key}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-dummy-api-key}
    command: sh -c "alembic upgrade head && python main.py"
    ports:
      - "8001:8001"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/config/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  celery-worker:
    build: .
    environment:
      ENV: production
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: app
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: ${SECRET_KEY:-development-only-change-me}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-dummy-api-key}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-dummy-api-key}
    command: celery -A app.core.celery_app worker --loglevel=info -Q celery,scheduled_tasks
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      disable: true

  celery-beat:
    build: .
    environment:
      ENV: production
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: app
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: ${SECRET_KEY:-development-only-change-me}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-dummy-api-key}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-dummy-api-key}
    command: celery -A app.core.celery_app beat --loglevel=info
    volumes:
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      disable: true

  flower:
    build: .
    profiles: ["monitoring"]
    environment:
      ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: ${SECRET_KEY:-development-only-change-me}
    command: celery -A app.core.celery_app flower --port=5555
    ports:
      - "${FLOWER_PORT:-5556}:5555"
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5555')"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build: ../medical-client
    ports:
      - "3001:80"
    depends_on:
      backend:
        condition: service_healthy

  admin:
    build: ../medical-admin
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    profiles: ["proxy"]
    ports:
      - "${NGINX_HTTP_PORT:-8086}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_aligned_data:
  redis_data:
